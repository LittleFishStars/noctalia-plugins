# ══════════════════════════════════════════════════════════════════════════
# ylxc/qweather —— 和风天气（QWeather）天气插件
#
# 用和风天气的实时天气 / 逐小时 / 逐日预报 / 灾害预警 / 空气质量 / 生活指数
# 数据，替代 Noctalia 内置的 weather 组件（内置走的是 open-meteo）。
#
# 目录结构：
#   plugin.toml            本清单
#   service.luau           后台服务：按间隔拉取和风数据，发布到插件共享状态
#   bar.luau               栏组件：天气图标 + 温度
#   panel.luau             详情面板：实况 / 24 小时 / 7 天 / 预警 / 空气质量
#   desktop.luau           桌面小组件：一张紧凑的天气卡
#   lib/qweather.luau      共享模块：配置、API 请求、解析、缓存、图标映射、格式化
#   lib/jwt.luau           共享模块：JWT（Ed25519）认证支持
#   bin/qweather-jwt.py    JWT 生成器（cryptography / openssl 双通道）
#   bin/qweather-check.py  终端自检：验证 API Host / 凭据 / 位置是否可用
#
# 放好后在「设置 → 插件」里启用，再往栏上加 ylxc/qweather:weather 组件。
# ══════════════════════════════════════════════════════════════════════════

id = "ylxc/qweather"
name = "QWeather"
name_key = "plugin.name"
version = "1.0.0"
plugin_api = 30
author = "ylxc"
license = "MIT"
icon = "cloud-sun"
description = "和风天气：实况、逐小时、7 天预报、灾害预警、空气质量与生活指数，可替代内置天气组件。"
description_key = "plugin.description"
tags = ["weather", "qweather", "climate", "bar"]
dependencies = []

# ── 凭据与接口 ──────────────────────────────────────────────────────────────

[[setting]]
key = "api_host"
type = "string"
label_key = "settings.api_host.label"
description_key = "settings.api_host.description"
default = ""

[[setting]]
key = "auth_mode"
type = "select"
label_key = "settings.auth_mode.label"
description_key = "settings.auth_mode.description"
default = "apikey"
options = [
  { value = "apikey", label_key = "settings.auth_mode.option.apikey" },
  { value = "jwt", label_key = "settings.auth_mode.option.jwt" },
]

[[setting]]
key = "api_key"
type = "string"
label_key = "settings.api_key.label"
description_key = "settings.api_key.description"
default = ""
advanced = true
visible_when = { key = "auth_mode", values = ["apikey"] }

[[setting]]
key = "jwt_private_key"
type = "file"
label_key = "settings.jwt_private_key.label"
description_key = "settings.jwt_private_key.description"
default = ""
extensions = [".pem", ".key"]
visible_when = { key = "auth_mode", values = ["jwt"] }

[[setting]]
key = "jwt_kid"
type = "string"
label_key = "settings.jwt_kid.label"
description_key = "settings.jwt_kid.description"
default = ""
visible_when = { key = "auth_mode", values = ["jwt"] }

[[setting]]
key = "jwt_sub"
type = "string"
label_key = "settings.jwt_sub.label"
description_key = "settings.jwt_sub.description"
default = ""
visible_when = { key = "auth_mode", values = ["jwt"] }

[[setting]]
key = "jwt_iss"
type = "string"
label_key = "settings.jwt_iss.label"
description_key = "settings.jwt_iss.description"
default = ""
visible_when = { key = "auth_mode", values = ["jwt"] }

# ── 位置 ────────────────────────────────────────────────────────────────────

[[setting]]
key = "location_mode"
type = "select"
label_key = "settings.location_mode.label"
description_key = "settings.location_mode.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.location_mode.option.auto" },
  { value = "city", label_key = "settings.location_mode.option.city" },
  { value = "coords", label_key = "settings.location_mode.option.coords" },
  { value = "cityid", label_key = "settings.location_mode.option.cityid" },
]

[[setting]]
key = "city_name"
type = "string"
label_key = "settings.city_name.label"
description_key = "settings.city_name.description"
default = ""
visible_when = { key = "location_mode", values = ["city"] }

[[setting]]
key = "latitude"
type = "string"
label_key = "settings.latitude.label"
description_key = "settings.latitude.description"
default = ""
visible_when = { key = "location_mode", values = ["coords"] }

[[setting]]
key = "longitude"
type = "string"
label_key = "settings.longitude.label"
description_key = "settings.longitude.description"
default = ""
visible_when = { key = "location_mode", values = ["coords"] }

[[setting]]
key = "location_id"
type = "string"
label_key = "settings.location_id.label"
description_key = "settings.location_id.description"
default = ""
visible_when = { key = "location_mode", values = ["cityid"] }

# ── 数据与刷新 ──────────────────────────────────────────────────────────────

[[setting]]
key = "lang"
type = "select"
label_key = "settings.lang.label"
description_key = "settings.lang.description"
default = "zh"
options = [
  { value = "zh", label_key = "settings.lang.option.zh" },
  { value = "zh-hant", label_key = "settings.lang.option.zh_hant" },
  { value = "en", label_key = "settings.lang.option.en" },
]

[[setting]]
key = "unit"
type = "select"
label_key = "settings.unit.label"
description_key = "settings.unit.description"
default = "metric"
options = [
  { value = "metric", label_key = "settings.unit.option.metric" },
  { value = "imperial", label_key = "settings.unit.option.imperial" },
]

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 20
min = 5
max = 360

[[setting]]
key = "daily_days"
type = "select"
label_key = "settings.daily_days.label"
description_key = "settings.daily_days.description"
default = "7"
options = [
  { value = "3", label_key = "settings.daily_days.option.3" },
  { value = "7", label_key = "settings.daily_days.option.7" },
  { value = "10", label_key = "settings.daily_days.option.10" },
]

[[setting]]
key = "hourly_hours"
type = "select"
label_key = "settings.hourly_hours.label"
description_key = "settings.hourly_hours.description"
default = "24"
options = [
  { value = "24", label_key = "settings.hourly_hours.option.24" },
  { value = "72", label_key = "settings.hourly_hours.option.72" },
]

[[setting]]
key = "fetch_warning"
type = "bool"
label_key = "settings.fetch_warning.label"
description_key = "settings.fetch_warning.description"
default = true

[[setting]]
key = "fetch_air"
type = "bool"
label_key = "settings.fetch_air.label"
description_key = "settings.fetch_air.description"
default = true

[[setting]]
key = "fetch_indices"
type = "bool"
label_key = "settings.fetch_indices.label"
description_key = "settings.fetch_indices.description"
default = false
advanced = true

# ── 栏组件 ──────────────────────────────────────────────────────────────────

[[widget]]
id = "weather"
entry = "bar.luau"

  [[widget.setting]]
  key = "show_text"
  type = "bool"
  label_key = "settings.show_text.label"
  description_key = "settings.show_text.description"
  default = true

  [[widget.setting]]
  key = "show_location"
  type = "bool"
  label_key = "settings.show_location.label"
  default = false

  [[widget.setting]]
  key = "show_feels"
  type = "bool"
  label_key = "settings.show_feels.label"
  default = false

  [[widget.setting]]
  key = "show_high_low"
  type = "bool"
  label_key = "settings.show_high_low.label"
  default = false

  [[widget.setting]]
  key = "show_humidity"
  type = "bool"
  label_key = "settings.show_humidity.label"
  default = false

  [[widget.setting]]
  key = "show_wind"
  type = "bool"
  label_key = "settings.show_wind.label"
  default = false

  [[widget.setting]]
  key = "fallback_glyph"
  type = "glyph"
  label_key = "settings.fallback_glyph.label"
  description_key = "settings.fallback_glyph.description"
  default = "cloud-sun"

  [[widget.setting]]
  key = "glyph_color"
  type = "select"
  label_key = "settings.glyph_color.label"
  description_key = "settings.glyph_color.description"
  default = "theme"
  options = [
    { value = "theme", label_key = "settings.glyph_color.option.theme" },
    { value = "primary", label_key = "settings.glyph_color.option.primary" },
    { value = "text", label_key = "settings.glyph_color.option.text" },
    { value = "temp", label_key = "settings.glyph_color.option.temp" },
  ]

  [widget.actions]
  left = "panel-toggle ylxc/qweather:panel"
  middle = "settings-open-widget"
  right = "none"

# ── 详情面板 ────────────────────────────────────────────────────────────────

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 620
placement = "floating"
position = "center"

# ── 桌面小组件 ──────────────────────────────────────────────────────────────

[[desktop_widget]]
id = "card"
entry = "desktop.luau"

# ── 后台服务：唯一的取数者，把快照写进插件共享状态 ──────────────────────────

[[service]]
id = "service"
entry = "service.luau"
